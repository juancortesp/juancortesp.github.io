name: Actualizar posts

on:
  issues:
    types: [opened]
  push:
    branches: [main]
    paths: [posts.json]
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency: posts

jobs:
  build:
    if: github.event_name != 'issues' || (contains(github.event.issue.labels.*.name, 'post') && github.event.issue.user.login == github.repository_owner)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Añadir post desde la issue
        if: github.event_name == 'issues'
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: python .github/scripts/build_posts.py --issue
      - name: Regenerar desde posts.json
        if: github.event_name != 'issues'
        run: python .github/scripts/build_posts.py
      - name: Publicar cambios
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add posts.json index.html en/index.html
          if git diff --cached --quiet; then echo "changed=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          git commit -m "Posts: actualización automática"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - name: Cerrar la issue
        if: github.event_name == 'issues'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue close ${{ github.event.issue.number }} --repo ${{ github.repository }} --comment "Publicado ✅ En 1-2 minutos aparece en https://juancortesp.github.io/#posts"
      - name: Avisar si falla
        if: failure() && github.event_name == 'issues'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue comment ${{ github.event.issue.number }} --repo ${{ github.repository }} --body "❌ No se pudo añadir el post. Revisa que el enlace sea de LinkedIn y que título y resumen estén rellenos."
